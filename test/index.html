<!DOCTYPE html>
<!--
  Browser-boundary test harness for the Go/WebAssembly migration of AnchorJS.

  This page runs the ORIGINAL AnchorJS Jasmine specs (test/spec/AnchorSpec.js,
  preserved verbatim) against the Go implementation compiled to WebAssembly
  (dist/anchorjs.wasm). The WASM module installs the global `AnchorJS`
  constructor and default `anchors` instance, exactly like the original UMD
  browser-globals branch, so the specs execute at the SAME DOM boundary as the
  original ChromeHeadless/Karma run.

  Boot ordering is critical: WebAssembly instantiation is asynchronous, so we
  must NOT let Jasmine auto-execute the queued specs before the WASM module has
  installed the global `AnchorJS`/`anchors`. We therefore load only boot0.js
  (which creates the Jasmine env but does NOT execute it) and drive execution
  manually: instantiate WASM -> go.run() installs globals synchronously ->
  load the spec file -> jasmine.getEnv().execute().

  A machine-readable summary is written to window.__ANCHORJS_TEST_RESULT__ and
  mirrored into document.title so a headless driver can read pass/fail counts.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AnchorJS (Go/WASM) Spec Runner</title>
    <link rel="stylesheet" href="vendor/jasmine-core/jasmine.css" />
  </head>
  <body>
    <!-- Jasmine core + HTML reporter (identical version to the original repo).
         NOTE: boot1.js is intentionally NOT loaded here; it would call
         env.execute() on window load, racing the async WASM boot. We call
         execute() ourselves once the WASM globals are ready. -->
    <script src="vendor/jasmine-core/jasmine.js"></script>
    <script src="vendor/jasmine-core/jasmine-html.js"></script>
    <script src="vendor/jasmine-core/boot0.js"></script>

    <!-- Go WASM runtime glue (generated by the Go toolchain). -->
    <script src="../dist/wasm_exec.js"></script>

    <script>
      // Result object the headless driver polls.
      window.__ANCHORJS_TEST_RESULT__ = { status: 'pending' };

      // Install a Jasmine reporter that captures the final tallies and any
      // failure messages into a machine-readable structure.
      (function installResultReporter() {
        var passed = 0;
        var failed = 0;
        var total = 0;
        var failures = [];

        jasmine.getEnv().addReporter({
          specDone: function (result) {
            total += 1;
            if (result.status === 'passed') {
              passed += 1;
            } else if (result.status === 'failed') {
              failed += 1;
              var msgs = (result.failedExpectations || []).map(function (fe) {
                return fe.message;
              });
              failures.push({ description: result.fullName, messages: msgs });
            }
          },
          jasmineDone: function (result) {
            window.__ANCHORJS_TEST_RESULT__ = {
              status: 'done',
              overallStatus: result.overallStatus,
              total: total,
              passed: passed,
              failed: failed,
              failures: failures,
            };
            // Embed failure detail in the DOM so a headless --dump-dom driver
            // can surface it without a live CDP connection.
            var pre = document.createElement('pre');
            pre.id = '__ANCHORJS_FAILURES__';
            pre.textContent = JSON.stringify(failures, null, 2);
            document.body.appendChild(pre);
            document.title =
              'RESULT total=' + total + ' passed=' + passed + ' failed=' + failed;
          },
        });
      })();

      function reportBootError(message) {
        window.__ANCHORJS_TEST_RESULT__ = { status: 'error', error: String(message) };
        document.title = 'RESULT error=' + message;
      }

      // Dynamically load the verbatim spec file, then execute Jasmine. This runs
      // ONLY after the WASM globals (AnchorJS/anchors) are installed, so the
      // specs' beforeEach (which does `new AnchorJS()`) always sees them.
      function loadSpecsAndRun() {
        var script = document.createElement('script');
        script.src = 'spec/AnchorSpec.js';
        script.onload = function () {
          try {
            jasmine.getEnv().execute();
          } catch (e) {
            reportBootError('execute:' + e);
          }
        };
        script.onerror = function () {
          reportBootError('spec-load-failed');
        };
        document.body.appendChild(script);
      }

      // Boot the WASM module, wait for the AnchorJS global to be installed,
      // then load specs and let Jasmine execute them.
      (function bootWasm() {
        if (typeof Go === 'undefined') {
          reportBootError('no-Go');
          return;
        }

        var go = new Go();
        WebAssembly.instantiateStreaming(
          fetch('../dist/anchorjs.wasm'),
          go.importObject
        )
          .then(function (obj) {
            // Run the Go program; main() registers the global AnchorJS ctor and
            // default `anchors` synchronously, then blocks on select{} (so this
            // promise never resolves, which is expected — we do NOT await it).
            go.run(obj.instance);

            // Globals are now installed. Verify, then load + run the specs.
            if (typeof AnchorJS === 'undefined' || typeof anchors === 'undefined') {
              reportBootError('globals-missing-after-run');
              return;
            }
            loadSpecsAndRun();
          })
          .catch(function (err) {
            reportBootError('instantiate');
            void err;
          });
      })();
    </script>
  </body>
</html>
